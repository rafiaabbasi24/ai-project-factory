name: Daily AI Project Factory

on:
  # Runs every day at 08:00 IST = 02:30 UTC
  schedule:
    - cron: "30 2 * * *"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      category:
        description: "AI category to generate (leave blank for auto-rotation)"
        required: false
        default: ""
      dry_run:
        description: "Dry run - plan only, skip repo creation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-and-publish:
    name: Generate and Publish AI Project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout factory repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run AI Project Factory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_CATEGORIES: ${{ vars.PROJECT_CATEGORIES || 'LLM,Generative AI,Machine Learning,Deep Learning,NLP,Transformers,Reinforcement Learning' }}
          PROJECT_GITHUB_PREFIX: ${{ vars.PROJECT_GITHUB_PREFIX || 'ai-daily-' }}
          PROJECT_VISIBILITY: ${{ vars.PROJECT_VISIBILITY || 'public' }}
          MAX_FILES: ${{ vars.MAX_FILES || '10' }}
          OVERRIDE_CATEGORY: ${{ github.event.inputs.category }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/factory_runner.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_number }}
          path: factory_run.log
          retention-days: 30
